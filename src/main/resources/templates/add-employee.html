<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 24px;
            font-size: 24px;
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            background: #2563eb;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        #message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 4px;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Add Employee</h1>
        <form id="employeeForm">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <button type="submit" id="submitBtn">Submit</button>
        </form>
        <div id="message"></div>
    </div>

    <script>
        const form = document.getElementById("employeeForm");
        const message = document.getElementById("message");
        const submitBtn = document.getElementById("submitBtn");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();

            message.textContent = "";
            message.style.backgroundColor = "";
            message.style.color = "";
            submitBtn.disabled = true;

            try {
                const response = await fetch("http://localhost:8080/api/employees", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ name: name, email: email })
                });

                if (!response.ok) {
                    throw new Error("Request failed with status " + response.status);
                }

                const employee = await response.json();

                message.style.backgroundColor = "#ecfdf5";
                message.style.color = "#065f46";
                message.innerHTML =
                    "Employee added successfully.<br>" +
                    "ID: " + employee.id + "<br>" +
                    "QR Code: " + employee.qrCode;

                form.reset();
            } catch (error) {
                message.style.backgroundColor = "#fef2f2";
                message.style.color = "#991b1b";
                message.textContent = "Could not add employee. " + error.message;
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
