<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Attendance</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #222;
            padding: 24px 16px;
        }

        .card {
            width: 100%;
            max-width: 480px;
            background: #fff;
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        .hint {
            margin: 0 0 20px;
            color: #555;
            font-size: 14px;
        }

        #reader {
            width: 100%;
            margin-bottom: 20px;
            overflow: hidden;
            border-radius: 8px;
        }

        #result {
            min-height: 72px;
            padding: 16px;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            line-height: 1.4;
            white-space: pre-line;
        }

        #result.idle {
            background: #f8fafc;
            color: #64748b;
            font-size: 16px;
            font-weight: normal;
        }

        #result.success {
            background: #ecfdf5;
            color: #065f46;
        }

        #result.paused {
            background: #fff7ed;
            color: #9a3412;
            font-size: 18px;
        }

        #result.error {
            background: #fef2f2;
            color: #991b1b;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Scan Attendance</h1>
        <p class="hint">Point the camera at an employee QR code</p>
        <div id="reader"></div>
        <div id="result" class="idle">Waiting for scan...</div>
    </div>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script th:inline="none">
        const resultBox = document.getElementById("result");
        const scanner = new Html5Qrcode("reader");
        let isBusy = false;

        function showMessage(text, className) {
            resultBox.className = className;
            resultBox.textContent = text;
        }

        function pauseScanner() {
            try {
                scanner.pause(true);
            } catch (error) {
                // Older library versions may not support pause().
            }
        }

        function resumeScanner() {
            try {
                scanner.resume();
            } catch (error) {
                // Older library versions may not support resume().
            }
        }

        async function onScanSuccess(decodedText) {
            if (isBusy) {
                return;
            }

            isBusy = true;
            pauseScanner();

            try {
                const response = await fetch("http://localhost:8080/api/attendance/scan", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ qrCode: decodedText })
                });

                if (response.status === 404) {
                    throw new Error("No employee found for this QR code.");
                }

                if (!response.ok) {
                    throw new Error("Request failed with status " + response.status);
                }

                const data = await response.json();
                const action = data.type === "CHECK_IN" ? "Checked IN" : "Checked OUT";
                showMessage(data.employeeName + "\n" + action, "success");
            } catch (error) {
                showMessage(error.message, "error");
            }

            await new Promise(function (resolve) {
                setTimeout(resolve, 3000);
            });

            showMessage("Scanning paused", "paused");

            await new Promise(function (resolve) {
                setTimeout(resolve, 400);
            });

            showMessage("Waiting for scan...", "idle");
            resumeScanner();
            isBusy = false;
        }

        scanner.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: 250 },
            onScanSuccess,
            function () {
                // Ignore frame-by-frame scan misses.
            }
        ).catch(function (error) {
            showMessage("Could not start camera. " + error, "error");
        });
    </script>
</body>
</html>
